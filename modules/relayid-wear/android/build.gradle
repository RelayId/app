plugins {
    id 'com.android.library'
    id 'expo-module-gradle-plugin'
}

group = 'com.relayid.wear'
version = '1.0.0'

android {
    namespace "com.relayid.wear"

    defaultConfig {
        versionCode 1
        versionName "1.0.0"
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
}
